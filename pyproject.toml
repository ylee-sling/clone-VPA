[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cma-vpa"
version = "0.1.0"
description = "Official implementation of CMA-VPA: Dynamic Latent Cloning with Continuous Barrier Guidance (Multi-Agent Vision-Predictor-Action)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Yeonseok Lee", email = "ylee@sling.ai.kr" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24"]
keywords = ["multi-agent", "robotics", "JEPA", "flow matching", "control barrier functions", "VLA", "quadrotor", "manipulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.10"]
maniskill = ["mani_skill", "gymnasium"]
clip = ["transformers>=4.30"]

[project.urls]
Homepage = "https://github.com/ylee-sling/clone-VPA"
Repository = "https://github.com/ylee-sling/clone-VPA"
Paper = "https://doi.org/10.5281/zenodo.23679374"
"Single-agent VPA" = "https://github.com/ylee-sling/Vision-Predictor-Action"

[tool.setuptools.packages.find]
include = ["cma_vpa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
